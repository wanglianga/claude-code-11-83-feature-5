services:
  db:
    image: postgres:18-alpine
    container_name: foodsafety-db
    environment:
      POSTGRES_DB: ccdev
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodsafety-exchange
    environment:
      # 容器内通过服务名访问数据库
      DB_URL: jdbc:postgresql://db:5432/ccdev
      DB_USER: ccdev
      DB_PASS: ccdev
      SERVER_PORT: "8080"
      # TARGET_BASE_URL 留空：投递目标使用应用内置的模拟目标端 /target/**（自调用 localhost:8080）
      TARGET_BASE_URL: ""
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
